<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d111a">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/minercraftory.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>Page not found - Classic's Craftworks</title>
  <meta name="description" content="This page doesn't exist. Head back to Classic's Craftworks for Minecraft data packs, mods & resource packs." />
</head>
<body>

<!-- Logo and name are repeated here so they show before scripts run; keep in sync with SITE_DATA.brand. -->
<header class="site-header" id="site-header">
  <div class="site-header-inner" id="site-header-inner">
    <a class="brand" href="/">
      <img id="brand-logo" class="brand-logo" src="images/logo.png" alt="" width="44" height="44">
      <span id="brand-name" class="brand-name">CLASSIC'S CRAFTWORKS</span>
    </a>
    <div class="site-menu" id="site-menu">
      <nav id="site-nav" class="site-nav" aria-label="Main"></nav>
    </div>
  </div>
</header>

<div class="page">

  <main class="not-found">
    <div class="not-found-card">
      <p class="not-found-code">404</p>
      <h1>Page not found</h1>
      <p class="not-found-text">This page doesn't exist. It might have been moved, renamed, or never existed in the first place.</p>
      <a class="top-link" href="/">
        <span>Go Home</span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-grid">
      <div class="footer-col footer-brand-col">
        <a class="footer-brand" href="/">
          <img class="footer-logo" src="images/logo.png" alt="" width="52" height="52">
          <span class="footer-brand-name">CLASSIC'S CRAFTWORKS</span>
        </a>
        <p id="established" class="footer-line footer-established"></p>
        <p id="copyright" class="footer-line footer-copyright"></p>
      </div>

      <nav class="footer-col" aria-label="Footer projects">
        <h2 class="footer-heading">Projects</h2>
        <ul id="footer-projects" class="footer-list"></ul>
      </nav>

      <div class="footer-col">
        <h2 class="footer-heading">Links</h2>
        <ul id="social-links" class="footer-list" aria-label="Social links"></ul>
      </div>
    </div>

    <div class="footer-legal">
      <p id="disclaimer" class="footer-line footer-disclaimer"></p>
      <p id="icon-credits" class="footer-line footer-credits"></p>
      <p id="site-version" class="footer-version"></p>
    </div>
  </footer>

</div>

<script src="data.js" defer></script>
<script src="section-page.js" defer></script>
<script src="404.js" defer></script>
<script src="search.js" defer></script>
</body>
</html>
