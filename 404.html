<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d111a">
<link rel="apple-touch-icon" href="images/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/minercraftory.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
  <title>Page not found - Classic's Craftworks</title>
  <meta name="description" content="This page doesn't exist. Head back to Classic's Craftworks for Minecraft data packs, mods & resource packs." />
</head>
<body>

<div class="page">

  <!-- Same header markup as index.html — filled in by renderBrand() in
       section-page.js, so it stays in sync with data.js automatically. -->
  <!-- Logo and name are written here so they show before the scripts run;
       renderBrand() sets the same values from data.js. Keep them in sync
       with SITE_DATA.brand if those change. -->
  <header class="masthead">
    <img id="brand-logo" class="brand-logo" src="images/logo.png" alt="Classic's Craftworks logo" width="88" height="88">
    <div class="brand-text">
      <h1 id="brand-name">CLASSIC'S CRAFTWORKS</h1>
    </div>
  </header>

  <main class="not-found">
    <div class="not-found-card">
      <p class="not-found-code">404</p>
      <h2>Page not found</h2>
      <p class="not-found-text">This page doesn't exist. It might have been moved, renamed, or never existed in the first place.</p>
      <a class="top-link" href="/">
        <span>Go Home</span>
      </a>
    </div>
  </main>

  <!-- Same footer markup as index.html — filled in by renderFooter() -->
  <footer class="site-footer">
    <div id="social-links" class="social-row" aria-label="Social links"></div>
    <p id="copyright" class="footer-line"></p>
    <p id="disclaimer" class="footer-line footer-disclaimer"></p>
    <p id="icon-credits" class="footer-line footer-credits"></p>
    <p id="site-version" class="footer-version"></p>
  </footer>

</div>

<script src="data.js" defer></script>
<script src="section-page.js" defer></script>
<script src="404.js" defer></script>
</body>
</html>
