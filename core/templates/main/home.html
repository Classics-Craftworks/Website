  <div class="skel-hero" data-skeleton aria-hidden="true">
    <div>
      <span class="skel skel-h1"></span>
      <span class="skel skel-line w-80"></span>
      <span class="skel skel-line w-60"></span>
    </div>
    <span class="skel skel-panel"></span>
  </div>

  <section id="splash" class="splash" aria-labelledby="splash-headline" hidden>
    <div class="splash-inner">
      <div class="splash-copy">
        <h1 id="splash-headline" class="splash-headline"></h1>
        <p id="splash-subtitle" class="splash-subtitle"></p>
        <div id="splash-actions" class="splash-actions"></div>
      </div>
      <section id="stats-section" class="stats-section" aria-labelledby="stats-heading">
        <h2 id="stats-heading" class="stats-heading visually-hidden">Statistics</h2>
        <div id="stats-grid" class="stats-grid"></div>
        <p id="stats-updated" class="stats-updated"></p>
      </section>
{{#if hasProjects}}
      <aside id="splash-featured" class="splash-featured" aria-label="Featured project"></aside>
{{/if}}
    </div>
  </section>

{{#if hasProjects}}
  <section id="projects" class="projects-intro" aria-labelledby="projects-heading">
    <h2 id="projects-heading" class="projects-heading"></h2>
    <p id="projects-subtitle" class="projects-subtitle"></p>
  </section>
{{/if}}

  <main id="catalog" tabindex="-1">
    <div class="skel-grid" data-skeleton aria-hidden="true"><span class="skel skel-card"></span><span class="skel skel-card"></span><span class="skel skel-card"></span></div>
  </main>

  <section id="latest-news" class="news-section" aria-labelledby="news-heading" hidden>
    <h2 id="news-heading" class="stats-heading"></h2>
    <ul id="news-list" class="news-list"></ul>
    <p id="news-more" class="news-more"></p>
  </section>
