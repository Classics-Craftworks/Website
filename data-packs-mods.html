<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="https://classicscraftworks.co.uk/data-packs-mods">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d111a">
<link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/minercraftory.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
  <!-- Basic Meta Tags -->
  <title>Data Packs & Mods - Classic's Craftworks</title>
  <meta name="description" content="Minecraft Java Edition data packs & mods from Classic's Craftworks. Sometimes useful. Always Minecraft." />

  <!-- Open Graph Preview Cards (Discord, Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Classic's Craftworks" />
  <meta property="og:title" content="Data Packs & Mods - Classic's Craftworks" />
  <meta property="og:description" content="Minecraft Java Edition data packs & mods from Classic's Craftworks. Sometimes useful. Always Minecraft." />
  <meta property="og:image" content="https://classicscraftworks.co.uk/images/logo.png" />
  <meta property="og:image:alt" content="Classic's Craftworks logo" />
  <meta property="og:url" content="https://classicscraftworks.co.uk/data-packs-mods" />

  <!-- Twitter / X Preview Cards -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Data Packs & Mods - Classic's Craftworks" />
  <meta name="twitter:description" content="Minecraft Java Edition data packs & mods from Classic's Craftworks. Sometimes useful. Always Minecraft." />
  <meta name="twitter:image" content="https://classicscraftworks.co.uk/images/logo.png" />
  <meta name="twitter:image:alt" content="Classic's Craftworks logo" />
</head>
<body data-page="data-packs-mods">

<!-- Same skip link as index.html, pointing at this page's project list. -->
<a href="#catalog" class="skip-link">Skip to projects</a>

<!-- Static fallback shown only when JavaScript is disabled/blocked, same
     idea as index.html's noscript block — see section-page.js for how
     the rest of the page is built from data.js. -->
<noscript>
  <div class="noscript-notice">
    <h1>CLASSIC'S CRAFTWORKS</h1>
    <p>Minecraft Java Edition data packs &amp; mods.</p>
    <p>
      This site needs JavaScript enabled to build its project catalog.
      In the meantime, you can browse our projects directly on
      <a href="https://modrinth.com/organization/classics-craftworks">Modrinth</a>
      or <a href="https://github.com/Classics-Craftworks">GitHub</a>.
    </p>
  </div>
</noscript>

<!-- Site header: brand on the left, then Home / Projects dropdown / About,
     then the search box on the right. The logo and name are written here so
     they show before the scripts run (renderBrand() sets the same values from
     data.js - keep them in sync with SITE_DATA.brand). The nav inside
     #site-nav is built by renderSiteHeader() in section-page.js, and the
     search box is added to #site-menu by search.js. -->
<header class="site-header" id="site-header">
  <div class="site-header-inner" id="site-header-inner">
    <a class="brand" href="/">
      <img id="brand-logo" class="brand-logo" src="images/logo.png" alt="" width="44" height="44">
      <span id="brand-name" class="brand-name">CLASSIC'S CRAFTWORKS</span>
    </a>
    <div class="site-menu" id="site-menu">
      <nav id="site-nav" class="site-nav" aria-label="Main"></nav>
    </div>
  </div>
</header>

<div class="page">

  <!-- Filled in by section-page.js (see renderFlatSection()): the
       section heading followed by its project cards. -->
  <main id="catalog" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-grid">
      <div class="footer-col footer-brand-col">
        <a class="footer-brand" href="/">
          <img class="footer-logo" src="images/logo.png" alt="" width="52" height="52">
          <span class="footer-brand-name">CLASSIC'S CRAFTWORKS</span>
        </a>
        <p id="established" class="footer-line footer-established"></p>
        <p id="copyright" class="footer-line footer-copyright"></p>
      </div>

      <nav class="footer-col" aria-label="Footer projects">
        <h2 class="footer-heading">Projects</h2>
        <ul id="footer-projects" class="footer-list"></ul>
      </nav>

      <div class="footer-col">
        <h2 class="footer-heading">Links</h2>
        <ul id="social-links" class="footer-list" aria-label="Social links"></ul>
      </div>
    </div>

    <div class="footer-legal">
      <p id="disclaimer" class="footer-line footer-disclaimer"></p>
      <p id="icon-credits" class="footer-line footer-credits"></p>
      <p id="site-version" class="footer-version"></p>
    </div>
  </footer>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" data-tooltip="Back to top"></button>

</div>

<script src="data.js" defer></script>
<script src="section-page.js" defer></script>
<script src="search.js" defer></script>
</body>
</html>
