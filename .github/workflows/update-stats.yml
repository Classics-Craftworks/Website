name: Update download stats

on:
  schedule:
    - cron: '17 5 * * *' # daily, 05:17 UTC
  workflow_dispatch:      # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch download counts and update stats.js
        run: node .github/scripts/update-stats.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- stats.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.js
          git commit -m "Update download stats"
          git push
