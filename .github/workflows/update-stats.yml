name: Update site stats

on:
  schedule:
    - cron: '17 5 * * *' # daily, 05:17 UTC
  workflow_dispatch:      # lets you run it manually from the Actions tab

permissions:
  contents: write
  actions: write          # to start the deploy workflow (see the last step)

env:
  SITE: classics-craftworks   # the site whose stats this run updates

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch download and follower counts, bump version, update changelog and sitemap date
        run: node .github/scripts/update-stats.mjs "$SITE"

      - name: Commit changes and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="sites/$SITE"
          if git diff --quiet -- "$DIR/public/stats.js" "$DIR/public/data.js" "$DIR/CHANGELOG.md" "$DIR/site.config.js"; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(grep -oP 'label:\s*"\Kv[^"]+' "$DIR/public/data.js" | head -1)
          git add "$DIR/public/stats.js" "$DIR/public/data.js" "$DIR/CHANGELOG.md" "$DIR/site.config.js"
          git commit -m "$VERSION: Update site stats"
          git push
          # A push made with the built-in token doesn't start other workflows, so start the deploy directly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
