name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds every site, so a change to core/ that breaks any one of them fails here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/classics-craftworks

  # GitHub Pages hosts one site per repository, so this publishes classicscraftworks.co.uk.
  # In the repo settings, set Pages > Source to "GitHub Actions". Other sites deploy elsewhere
  # (see README.md, "Hosting").
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
