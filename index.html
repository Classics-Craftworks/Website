<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="https://classicscraftworks.co.uk/">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="images/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#18181B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
  <!-- Basic Meta Tags -->
  <title>Classic's Craftworks</title>
  <meta name="description" content="Minecraft Java Edition data packs, mods & resource packs. Sometimes useful. Always Minecraft." />

  <!-- Open Graph Preview Cards (Discord, Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Classic's Craftworks" />
  <meta property="og:description" content="Minecraft Java Edition data packs, mods & resource packs. Sometimes useful. Always Minecraft." />
  <meta property="og:image" content="https://classicscraftworks.co.uk/images/logo.png" />
  <meta property="og:url" content="https://classicscraftworks.co.uk/" />

  <!-- Twitter / X Preview Cards -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Classic's Craftworks" />
  <meta name="twitter:description" content="Minecraft Java Edition data packs, mods & resource packs. Sometimes useful. Always Minecraft." />
  <meta name="twitter:image" content="https://classicscraftworks.co.uk/images/logo.png" />
</head>
<body>

<!-- First focusable element on the page, so keyboard users can jump
     straight past the header and page-switcher nav bar to the section
     buttons instead of tabbing through all of it first. Hidden until it
     receives focus (see .skip-link in styles.css). Works even with JS
     disabled, since it's a plain #catalog fragment link. -->
<a href="#catalog" class="skip-link">Skip to projects</a>

<!-- Static fallback shown only when JavaScript is disabled/blocked.
     Everything else on this page — brand name/tagline/logo, nav links,
     the section buttons, footer — is built by index.js from data.js,
     so without JS the rest of the page stays completely blank. Keep
     the name/tagline/links here roughly in sync with data.js's brand
     and topLinks if those ever change. -->
<noscript>
  <div class="noscript-notice">
    <h1>CLASSIC'S CRAFTWORKS</h1>
    <p>Minecraft Java Edition data packs, mods &amp; resource packs.</p>
    <p>
      This site needs JavaScript enabled to build its project catalog.
      In the meantime, you can browse our projects directly on
      <a href="https://modrinth.com/organization/classics-craftworks">Modrinth</a>
      or <a href="https://github.com/Classics-Craftworks">GitHub</a>.
    </p>
  </div>
</noscript>

<div class="page">

  <header class="masthead">
    <img id="brand-logo" class="brand-logo" alt="" width="88" height="88">
    <div class="brand-text">
      <h1 id="brand-name"></h1>
      <p id="brand-tagline"></p>
    </div>
    <nav id="top-links" class="link-row" aria-label="Primary links"></nav>
  </header>

  <!-- Sticky page-switcher bar, identical to the one on the section
       pages (data-packs-mods.html etc.): Home plus one link per section
       page, with the current page shown as the filled pill. Built by
       renderPageNav() in section-page.js from SITE_DATA.pages in
       data.js. -->
  <nav id="page-nav" class="section-nav" aria-label="Site pages"></nav>

  <!-- Starts empty on purpose — index.js fills it with one big button
       per section (icons of that section's first four projects + its
       name), using the content from data.js. If JavaScript is disabled,
       this area stays blank. tabindex="-1" lets the skip link above
       move keyboard focus here (not just scroll to it), without adding
       it to the normal Tab order. -->
  <main id="catalog" tabindex="-1"></main>

  <footer class="site-footer">
    <div id="social-links" class="social-row" aria-label="Social links"></div>
    <p id="copyright" class="footer-line"></p>
    <p id="disclaimer" class="footer-line footer-disclaimer"></p>
    <p id="icon-credits" class="footer-line footer-credits"></p>
    <p id="site-version" class="footer-version"></p>
  </footer>

  <!-- Fixed-position button that fades in once you've scrolled down a bit
       (see .back-to-top in styles.css) and scrolls back to the top when
       clicked (see initBackToTop() in section-page.js). Its position in the DOM
       doesn't matter since it's positioned via CSS, not page flow. -->
  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" data-tooltip="Back to top"></button>

</div>

<script src="data.js" defer></script>
<script src="section-page.js" defer></script>
<script src="index.js" defer></script>
<script src="search.js" defer></script>
</body>
</html>
