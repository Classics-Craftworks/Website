<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://classicscraftworks.co.uk/">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
  <!-- Basic Meta Tags -->
  <title>Classic's Craftworks</title>
  <meta name="description" content="Minecraft Java Edition data packs, mods & resource packs. Sometimes useful. Always Minecraft." />

  <!-- Open Graph Preview Cards (Discord, Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Classic's Craftworks" />
  <meta property="og:description" content="Minecraft Java Edition data packs, mods & resource packs. Sometimes useful. Always Minecraft." />
  <meta property="og:image" content="https://classicscraftworks.co.uk/images/logo.png" />
  <meta property="og:url" content="https://classicscraftworks.co.uk/" />

  <!-- Twitter / X Preview Cards -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Classic's Craftworks" />
  <meta name="twitter:description" content="Minecraft Java Edition data packs, mods & resource packs. Sometimes useful. Always Minecraft." />
  <meta name="twitter:image" content="https://classicscraftworks.co.uk/images/logo.png" />
</head>
<body>

<div class="page">

  <header class="masthead">
    <img id="brand-logo" class="brand-logo" alt="" width="88" height="88">
    <div class="brand-text">
      <h1 id="brand-name"></h1>
      <p id="brand-tagline"></p>
    </div>
    <nav id="top-links" class="link-row" aria-label="Primary links"></nav>
  </header>

  <!-- This <main> starts empty on purpose — script.js fills it in with
       every section/project card once the page loads, using the content
       from data.js. If JavaScript is disabled, this area stays blank. -->
  <main id="catalog"></main>

  <footer class="site-footer">
    <div id="social-links" class="social-row" aria-label="Social links"></div>
    <p id="copyright" class="footer-line"></p>
    <p id="disclaimer" class="footer-line footer-disclaimer"></p>
    <p class="footer-line footer-credits"> Icons by <a href="https://icons8.com" target="_blank" rel="noopener noreferrer" class="credits-link">Icons8</a></p>
    <p id="site-version" class="footer-version"></p>
  </footer>

</div>

<script src="data.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
